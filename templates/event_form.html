{% extends 'base.html' %}{% block title %}Create event{% endblock %}{% block content %}
<h1 class="h2">Create new event</h1><div class="card p-4" style="max-width:790px"><form method="post" action="/admin/events/new"><input type="hidden" name="csrf" value="{{csrf}}">
<div class="row g-3"><div class="col-md-8"><label class="form-label">Event title</label><input name="title" class="form-control" required></div><div class="col-md-4"><label class="form-label">Category</label><select name="category" class="form-select"><option>Concert</option><option>Workshop</option><option>Seminar</option><option>Conference</option><option>Other</option></select></div>
<div class="col-12"><label class="form-label">Venue</label><select name="venue_id" class="form-select">{% for v in venues %}<option value="{{v.id}}">{{v.name}} (capacity {{v.capacity}})</option>{% endfor %}</select></div>
<div class="col-md-6"><label class="form-label">Start time (Sri Lanka)</label><input type="datetime-local" name="start_at" class="form-control" required></div><div class="col-md-6"><label class="form-label">End time (Sri Lanka)</label><input type="datetime-local" name="end_at" class="form-control" required></div>
<div class="col-12"><label class="form-label">Description</label><textarea name="description" class="form-control"></textarea></div></div>
<h2 class="h5 mt-4">Ticket category 1 (required)</h2><div class="row g-2"><div class="col-md-4"><input name="ticket1_name" class="form-control" placeholder="Standard" value="Standard" required></div><div class="col-md-4"><input name="ticket1_price" type="number" min="0" step="0.01" class="form-control" placeholder="Price" value="1000" required></div><div class="col-md-4"><input name="ticket1_quantity" type="number" min="1" class="form-control" placeholder="Quantity" value="50" required></div></div>
<h2 class="h5 mt-4">Ticket category 2 (optional)</h2><div class="row g-2"><div class="col-md-4"><input name="ticket2_name" class="form-control" placeholder="VIP"></div><div class="col-md-4"><input name="ticket2_price" type="number" min="0" step="0.01" class="form-control" placeholder="Price" value="0"></div><div class="col-md-4"><input name="ticket2_quantity" type="number" min="0" class="form-control" placeholder="Quantity" value="0"></div></div>
<label class="form-label mt-4">Save as</label><select name="status" class="form-select mb-3"><option value="draft">Draft</option><option value="published">Publish now (VenueAgent checks conflicts)</option></select><button class="btn btn-dark">Save event</button></form></div>
{% endblock %}
