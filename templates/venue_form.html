{% extends 'base.html' %}{% block title %}Save venue{% endblock %}{% block content %}
<h1 class="h2">{{'Edit venue' if venue else 'Create venue'}}</h1><div class="card p-4" style="max-width:690px"><form method="post" action="/admin/venues/save"><input type="hidden" name="csrf" value="{{csrf}}"><input type="hidden" name="venue_id" value="{{venue.id if venue else 0}}">
<label class="form-label">Venue name</label><input name="name" class="form-control mb-3" value="{{venue.name if venue else ''}}" required>
<label class="form-label">Location</label><input name="location" class="form-control mb-3" value="{{venue.location if venue else ''}}" required>
<label class="form-label">Capacity</label><input type="number" name="capacity" min="1" class="form-control mb-3" value="{{venue.capacity if venue else 100}}" required>
<label class="form-label">Description</label><textarea name="description" class="form-control mb-3">{{venue.description if venue else ''}}</textarea>
<label class="form-label">Image URL (optional)</label><input name="image_url" class="form-control mb-3" value="{{venue.image_url if venue else ''}}">
<label class="form-label">Hourly rate (LKR)</label><input type="number" name="hourly_rate" min="0" step="0.01" class="form-control mb-3" value="{{venue.hourly_rate if venue else 2000}}" required>
<label class="form-check mb-3"><input type="checkbox" name="hire_open" value="true" class="form-check-input" {% if not venue or venue.hire_open %}checked{% endif %}> Open for private hire</label><button class="btn btn-dark">Save venue</button></form></div>
{% endblock %}
