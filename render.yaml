services:
  - type: web
    name: eventsphere-ica02
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: 'true'
      - key: APP_TIMEZONE
        value: Asia/Colombo
      - key: DATABASE_URL
        fromDatabase:
          name: eventsphere-db
          property: connectionString
databases:
  - name: eventsphere-db
    plan: free
